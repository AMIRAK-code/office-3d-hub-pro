# Production setup: the app behind Caddy (automatic HTTPS).
#   cp ../.env.example ../.env   # then edit it
#   docker compose up -d
services:
  app:
    build: ..
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATA_DIR: /data
      TRUST_PROXY: "1"
    volumes:
      - office-data:/data
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - app

volumes:
  office-data:
  caddy-data:
